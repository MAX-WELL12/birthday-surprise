<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coming Soon...</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Animated Background -->
    <div class="background">

        <div class="stars"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>

        <div class="floating-hearts">
            <span>❤</span>
            <span>❤</span>
            <span>❤</span>
            <span>❤</span>
            <span>❤</span>
        </div>

    </div>

    <!-- Glass Card -->

    <main class="glass">

        <div class="heart-icon">
            ❤
        </div>

        <h1>A Special Day is Coming...</h1>

        <p class="subtitle">
            Counting down to Willies Birthday.
        </p>

        <div class="countdown">

            <div class="box">
                <h2 id="days">00</h2>
                <span>Days</span>
            </div>

            <div class="box">
                <h2 id="hours">00</h2>
                <span>Hours</span>
            </div>

            <div class="box">
                <h2 id="minutes">00</h2>
                <span>Minutes</span>
            </div>

            <div class="box">
                <h2 id="seconds">00</h2>
                <span>Seconds</span>
            </div>

        </div>

        <h3 class="unlock">
            Unlocks on
        </h3>

        <h2 class="date">
            August 18
        </h2>

        <div class="lock">

            🔒

            <p>
                This page is patiently waiting...
            </p>

        </div>

        <footer>

            "Good things are worth waiting for."

        </footer>

    </main>

    <!-- Sparkles -->

    <div id="sparkles"></div>

    <script src="script.js"></script>

</body>

</html>
